<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>팀워크 메이커</title>
<meta name="description" content="모둠 역할 성향 테스트 → 균형 팀 편성 → 협력 미션까지! 우리 반 팀워크 메이커">
<style>
/* ============ 🧱 블록 픽셀 테마 (Galmuri11 픽셀 폰트, SIL OFL) ============ */
@font-face{font-family:'Galmuri11';font-weight:400;font-display:swap;
  src:url('fonts/Galmuri11.woff2') format('woff2'),url('https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/Galmuri11.woff2') format('woff2')}
@font-face{font-family:'Galmuri11';font-weight:700;font-display:swap;
  src:url('fonts/Galmuri11-Bold.woff2') format('woff2'),url('https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/Galmuri11-Bold.woff2') format('woff2')}
:root{
  --panel:#C6C6C6; --hi:#FFFFFF; --lo:#555555; --edge:#000000; --slot:#8B8B8B; --slot-hi:#FFFFFF; --slot-lo:#373737;
  --text:#2B2B2B; --muted:#4E4E4E; --ink:#1E1E1E;
  --green:#4E9A2F; --red:#B3312C; --blue:#2E5FB5; --yellow:#E8B820; --purple:#7B3FC0; --pink:#D2608F; --gold:#FCDB4A;
  --bevel:inset 3px 3px 0 var(--hi),inset -3px -3px 0 var(--lo);
  --bevel-c:inset 3px 3px 0 rgba(255,255,255,.45),inset -3px -3px 0 rgba(0,0,0,.45);
  --drop:4px 4px 0 rgba(0,0,0,.5);
  --tex-dirt:none; --tex-grass:none; --tex-stone:none;
}
*{box-sizing:border-box;margin:0;padding:0;border-radius:0!important}
html,body{height:100%}
body{font-family:'Galmuri11','DungGeunMo',ui-monospace,monospace;font-synthesis:none;color:#fff;
  background:linear-gradient(rgba(0,0,0,.42),rgba(0,0,0,.42)),var(--tex-dirt) #5B3E2B;background-size:auto,64px 64px;
  image-rendering:pixelated;-webkit-font-smoothing:none;word-break:keep-all;line-height:1.55}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,select{font:inherit;color:inherit}
#app{min-height:100%;display:flex;flex-direction:column}
.wrap{width:100%;max-width:580px;margin:0 auto;padding:20px 16px 48px}
.wide{max-width:1300px}
.card{background:var(--panel);color:var(--text);border:3px solid var(--edge);box-shadow:var(--bevel),var(--drop);padding:20px}
.card.dark{background:#2B2B2B;color:#fff;box-shadow:inset 3px 3px 0 #555,inset -3px -3px 0 #111,var(--drop)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border:3px solid var(--edge);background:#7D7D7D;color:#fff;
  box-shadow:var(--bevel-c);font-weight:700;font-size:16px;text-shadow:2px 2px 0 #3F3F3F;user-select:none;white-space:nowrap;transition:filter .08s}
.btn:hover{filter:brightness(1.12);outline:2px solid #fff;outline-offset:-5px}
.btn:active{box-shadow:inset -3px -3px 0 rgba(255,255,255,.35),inset 3px 3px 0 rgba(0,0,0,.5)}
.btn:disabled{filter:grayscale(1) brightness(.75);cursor:not-allowed;outline:none;color:#BDBDBD}
.btn.big{width:100%;padding:15px;font-size:19px}
.btn.sm{padding:6px 11px;font-size:14px;border-width:2px;box-shadow:inset 2px 2px 0 rgba(255,255,255,.45),inset -2px -2px 0 rgba(0,0,0,.45)}
.btn.yellow{background:#D9A520} .btn.red{background:var(--red)} .btn.blue{background:var(--blue)}
.btn.green{background:#5AA83A} .btn.purple{background:var(--purple)} .btn.ink{background:#2B2B2B}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent;text-decoration:underline;font-weight:400;color:#E6E6E6;text-shadow:2px 2px 0 #000;outline:none}
.card .btn.ghost{color:var(--muted);text-shadow:none}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-weight:700;font-size:15px}
.input{width:100%;padding:12px 13px;border:3px solid #A0A0A0;outline:3px solid #000;outline-offset:0;background:#000;color:#fff;font-size:17px}
.input:focus{border-color:#fff}
select.input option{background:#000;color:#fff}
.muted{color:#D0D0D0} .card .muted{color:var(--muted)}
.center{text-align:center} .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between} .grow{flex:1}
h1{font-size:32px;font-weight:700;line-height:1.25;color:#fff;text-shadow:3px 3px 0 #3F3F3F}
.card h1{color:var(--text);text-shadow:2px 2px 0 #fff}
h2{font-size:23px;font-weight:700} h3{font-size:17px;font-weight:700}
.mc-title{font-size:38px;color:#E0E0E0;text-shadow:3px 3px 0 #3A3A3A,6px 6px 0 rgba(0,0,0,.35);letter-spacing:1px}
.mc-sub{display:inline-block;color:#FFFF55;text-shadow:2px 2px 0 #3F3F00;transform:rotate(-6deg);animation:pulse .6s ease-in-out infinite alternate;font-size:15px}
@keyframes pulse{to{transform:rotate(-6deg) scale(1.08)}}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border:2px solid #000;font-size:13px;font-weight:700;background:var(--slot);color:#fff;
  text-shadow:1px 1px 0 #333;box-shadow:inset 2px 2px 0 var(--slot-lo),inset -2px -2px 0 var(--slot-hi)}
.stack>*+*{margin-top:14px}
.hero-emoji{font-size:64px;line-height:1;display:block;animation:bob 1.6s steps(4) infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes pop{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes slideIn{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.pop{animation:pop .3s steps(5) both}
.slide{animation:slideIn .3s steps(6) both}
.demo-bar{background:#100010;color:#FFFF55;font-size:13px;padding:7px 12px;text-align:center;border-bottom:2px solid #2B0A5C}
.demo-bar b{color:#fff}
.grass-top{position:relative}
.grass-top::before{content:'';position:absolute;left:-3px;right:-3px;top:-3px;height:14px;background:var(--tex-grass) #5DA03A;background-size:64px 64px;border:3px solid #000;border-bottom:none}
.grass-top>:first-child{margin-top:8px}

/* ---------- 학생: 퀴즈 ---------- */
.qtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.dots{display:flex;gap:4px}
.dots i{width:14px;height:14px;border:2px solid #000;background:var(--slot);display:block;box-shadow:inset 2px 2px 0 var(--slot-lo)}
.dots i.on{background:#5AA83A;box-shadow:inset 2px 2px 0 rgba(255,255,255,.4)} .dots i.cur{background:var(--gold);outline:2px solid #fff}
.qcard{text-align:center;padding:30px 20px 24px;min-height:300px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:16px}
.qnum{font-size:14px;letter-spacing:2px;background:#2B2B2B;color:#FFFF55;padding:4px 12px;border:2px solid #000}
.qemoji{font-size:72px;line-height:1;width:116px;height:116px;display:flex;align-items:center;justify-content:center;background:var(--slot);border:3px solid #000;box-shadow:inset 3px 3px 0 var(--slot-lo),inset -3px -3px 0 var(--slot-hi)}
.qtext{font-size:22px;font-weight:700;line-height:1.6;white-space:pre-line}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.yn .btn{padding:18px 10px;font-size:22px;flex-direction:column;gap:4px}
.yn .btn small{font-size:13px;font-weight:400}
.analyzing{text-align:center;padding:60px 20px}
.analyzing .spinner{width:64px;height:64px;margin:0 auto 20px;background:var(--tex-grass) #5DA03A;background-size:64px 64px;border:3px solid #000;animation:spin 1.2s steps(8) infinite}

/* ---------- 역할 카드 ---------- */
.rolecard{position:relative;overflow:hidden;text-align:center;padding:26px 20px}
.rolecard .band{position:absolute;inset:0 0 auto 0;height:104px;border-bottom:3px solid #000;box-shadow:inset 0 -6px 0 rgba(0,0,0,.25)}
.rolecard .inner{position:relative}
.role-emoji{font-size:60px;width:104px;height:104px;margin:0 auto;border:3px solid #000;background:var(--slot);display:flex;align-items:center;justify-content:center;
  box-shadow:inset 3px 3px 0 var(--slot-lo),inset -3px -3px 0 var(--slot-hi),var(--drop)}
.role-name{font-size:30px;font-weight:700;margin-top:12px;color:#fff;text-shadow:3px 3px 0 #3F3F3F,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000}
.role-job{margin-top:6px}
.traits{text-align:left;margin-top:16px;display:grid;gap:6px}
.traits div{background:#B0B0B0;border:2px solid #000;box-shadow:inset 2px 2px 0 #DADADA,inset -2px -2px 0 #6E6E6E;padding:8px 12px;font-size:15px}
.tip{margin-top:14px;padding:12px 14px;border:2px solid #2B0A5C;outline:2px solid #100010;background:#100010;color:#fff;font-size:15px;text-align:left}
.bars{display:grid;gap:7px;margin-top:6px}
.bar{display:grid;grid-template-columns:182px 1fr 34px;align-items:center;gap:8px;font-size:14px}
.bar>span:first-child{white-space:nowrap}
.bar .track{height:14px;border:2px solid #000;background:#2B2B2B;overflow:hidden}
.bar .fill{height:100%;border-right:2px solid #000;transition:width .8s steps(10);box-shadow:inset 0 3px 0 rgba(255,255,255,.35)}
.waiting{display:flex;align-items:center;gap:12px}
.waiting .dotdot span{animation:blink 1.2s steps(1) infinite;display:inline-block}
.waiting .dotdot span:nth-child(2){animation-delay:.3s}.waiting .dotdot span:nth-child(3){animation-delay:.6s}
@keyframes blink{50%{opacity:0}}
.tasklist{display:grid;gap:8px;margin-top:10px;text-align:left}
.tasklist div{display:flex;gap:8px;align-items:flex-start;font-size:15px}
.tasklist b{flex:none;width:24px;height:24px;border:2px solid #000;display:flex;align-items:center;justify-content:center;font-size:13px;background:var(--gold);color:#3F2F00;box-shadow:inset -2px -2px 0 rgba(0,0,0,.3)}

/* ---------- 학생: 팀 / 미션 ---------- */
.teambanner{text-align:center;padding:24px 18px}
.teambanner .tname{font-size:28px;font-weight:700;color:#fff;text-shadow:3px 3px 0 #3F3F3F,-1px -1px 0 #000,1px 1px 0 #000}
.level{display:flex;align-items:center;gap:12px;margin-top:14px;text-align:left}
.level .mon{font-size:42px;width:70px;height:70px;border:3px solid #000;background:var(--slot);display:flex;align-items:center;justify-content:center;flex:none;box-shadow:inset 3px 3px 0 var(--slot-lo),inset -3px -3px 0 var(--slot-hi)}
.gauge{height:22px;border:3px solid #000;background:#1E1E1E;overflow:hidden;position:relative}
.gauge::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),#000 calc(10% - 2px) 10%);pointer-events:none}
.gauge .fill{height:100%;background:#80D830;box-shadow:inset 0 4px 0 #B8FF6A,inset 0 -4px 0 #4E8F18;transition:width .9s steps(10)}
.gauge.green .fill{background:#4ACD5A;box-shadow:inset 0 4px 0 #9BFFA5,inset 0 -4px 0 #237A2E}
.gauge.blue .fill{background:#4FC3E8;box-shadow:inset 0 4px 0 #A5EEFF,inset 0 -4px 0 #1E7FA0}
.gauge .lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;text-shadow:1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000;z-index:1}
.members{display:grid;gap:6px}
.member{display:flex;align-items:center;gap:10px;padding:8px 10px;border:2px solid #000;background:#B0B0B0;box-shadow:inset 2px 2px 0 #DADADA,inset -2px -2px 0 #6E6E6E}
.member.me{background:#E8D58A;box-shadow:inset 2px 2px 0 #FFF3BE,inset -2px -2px 0 #A08A30;outline:2px solid #fff;outline-offset:-6px}
.member .remoji{font-size:24px;width:44px;height:44px;border:2px solid #000;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:var(--bevel-c)}
.member .who{font-weight:700}
.member .what{font-size:13px;color:#3A3A3A}
.member .chk{margin-left:auto;font-size:22px}
.mission{padding:0;overflow:hidden}
.mission .mhead{padding:14px 18px;background:#2B2B2B;color:#fff;display:flex;gap:12px;align-items:center;border-bottom:3px solid #000}
.mission .mhead .me{font-size:38px}
.mission .mbody{padding:16px 18px}
.mytask{border:3px solid #000;padding:14px;background:#E8D58A;box-shadow:inset 3px 3px 0 #FFF3BE,inset -3px -3px 0 #A08A30;margin:12px 0}
.mytask .lab{font-size:13px;color:#5A4A10}
.mytask .txt{font-size:19px;font-weight:700;margin-top:4px}
.donebtn.on{background:#5AA83A}
.goalbox{display:flex;align-items:center;gap:12px}
.goalbox .gift{font-size:36px}

/* ---------- 오버레이 ---------- */
#overlay{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(16,0,16,.78);padding:16px}
#overlay.show{display:flex}
.count{font-size:160px;font-weight:700;color:var(--gold);text-shadow:8px 8px 0 #3F3000;animation:pop .3s steps(4) both}
.slotbox,.tslot{background:var(--panel);color:var(--text);border:3px solid #000;box-shadow:var(--bevel),6px 6px 0 #000;padding:24px;text-align:center;width:100%;max-width:440px}
.tslot{max-width:1000px;max-height:92vh;overflow:auto;text-align:left}
.slotwin{height:124px;overflow:hidden;border:3px solid #000;background:var(--slot);box-shadow:inset 3px 3px 0 var(--slot-lo),inset -3px -3px 0 var(--slot-hi);margin:14px 0;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;text-shadow:2px 2px 0 #333}
.slotwin .se{font-size:50px;line-height:1}
.slotwin .st{font-size:20px;font-weight:700;margin-top:6px}
.slotwin.rolling .se,.slotwin.rolling .st{filter:blur(1px)}
.tslot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:14px}
.tslot-cell{border:3px solid #000;padding:14px;text-align:center;background:var(--slot);color:#fff;box-shadow:inset 3px 3px 0 var(--slot-lo),inset -3px -3px 0 var(--slot-hi)}
.tslot-cell .note{color:#fff!important}
.tslot-cell .se{font-size:44px}
.tslot-cell .st{font-weight:700;font-size:18px;margin-top:4px;text-shadow:2px 2px 0 #333}
.tslot-cell.rolling .se,.tslot-cell.rolling .st{filter:blur(1px);opacity:.8}
.tslot-cell.landed{background:#D9A520;box-shadow:var(--bevel-c);animation:pop .3s steps(4) both}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(140px);background:#100010;color:#fff;padding:12px 18px;border:3px solid #2B0A5C;outline:2px solid #100010;z-index:60;transition:transform .25s steps(5),visibility .25s;visibility:hidden;max-width:calc(100% - 32px);text-align:center}
#toast.show{transform:translateX(-50%) translateY(0);visibility:visible}
.confetti{position:fixed;top:-40px;width:14px;height:14px;z-index:70;pointer-events:none;border:2px solid rgba(0,0,0,.5);animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}

/* ---------- 교사 ---------- */
.thead{background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.55)),var(--tex-stone) #6B6B6B;background-size:auto,64px 64px;color:#fff;padding:12px 16px;position:sticky;top:0;z-index:20;border-bottom:3px solid #000}
.thead .in{max-width:1300px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.thead .logo{font-weight:700;font-size:18px;margin-right:6px;text-shadow:2px 2px 0 #000}
.thead select{padding:7px 10px;border:3px solid #A0A0A0;outline:2px solid #000;background:#000;color:#fff}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0}
.tab{padding:10px 16px;border:3px solid #000;background:#7D7D7D;color:#fff;text-shadow:2px 2px 0 #3F3F3F;font-size:16px;box-shadow:var(--bevel-c)}
.tab.on{background:var(--panel);color:var(--text);text-shadow:none;box-shadow:var(--bevel);transform:translateY(-3px)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{padding:14px 16px}
.stat .n{font-size:32px;font-weight:700}
.stat .l{color:var(--muted);font-size:14px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px;margin-top:12px}
.scell{display:flex;align-items:center;gap:8px;padding:7px 10px;border:2px solid #000;background:#B0B0B0;font-size:15px;box-shadow:inset 2px 2px 0 #DADADA,inset -2px -2px 0 #6E6E6E}
.scell .x{margin-left:auto;opacity:.45;font-size:14px;padding:2px 6px}
.scell .x:hover{opacity:1;color:var(--red)}
.scell.testing{background:#8F8F8F;color:#E0E0E0}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.tcol{background:var(--panel);color:var(--text);border:3px solid #000;box-shadow:var(--bevel),var(--drop);padding:12px;min-height:160px}
.tcol.over{background:#E8D58A;outline:3px solid #fff;outline-offset:-8px}
.tcol h3{display:flex;align-items:center;gap:6px}
.tcol .miss{font-size:12px;color:var(--muted);margin:4px 0 8px;min-height:16px}
.tcol .miss .warn{color:#A01010}
.chips{display:grid;gap:5px}
.chip{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;padding:6px 8px;border:2px solid #000;background:#B0B0B0;box-shadow:inset 2px 2px 0 #DADADA,inset -2px -2px 0 #6E6E6E;
  cursor:grab;touch-action:none;user-select:none;font-size:15px}
.chip .nm{white-space:nowrap}
.chip .rsel{margin-left:auto;flex:0 0 auto;font-size:13px;border:2px solid #A0A0A0;outline:1px solid #000;padding:3px 4px;background:#000;color:#fff;max-width:none;width:auto}
.chip .tend{font-size:12px}
.chip.dup{background:#D98A8A;box-shadow:inset 2px 2px 0 #F2B8B8,inset -2px -2px 0 #8A3A3A}
.chip.src{opacity:.35}
.chip.ghost{position:fixed;z-index:80;pointer-events:none;box-shadow:6px 6px 0 rgba(0,0,0,.6);cursor:grabbing;outline:2px solid #fff}
.pool{background:#9A9A9A}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.tmcard{padding:16px}
.tmcard .cur{border:2px solid #000;padding:10px 12px;background:#B0B0B0;box-shadow:inset 2px 2px 0 #DADADA,inset -2px -2px 0 #6E6E6E;margin:10px 0}
.mchips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.mchip{padding:5px 9px;border:2px solid #000;font-size:14px;background:var(--slot);color:#fff;text-shadow:1px 1px 0 #333;box-shadow:inset 2px 2px 0 var(--slot-lo),inset -2px -2px 0 var(--slot-hi)}
.mchip.ok{background:#5AA83A;box-shadow:var(--bevel-c)}
.qr{background:#fff;padding:8px;border:3px solid #000;display:inline-block}
.qr img,.qr canvas{display:block;width:140px;height:140px}
.urlbox{font-size:14px;background:#000;color:#fff;border:2px solid #A0A0A0;outline:2px solid #000;padding:8px 10px;word-break:break-all}
.note{font-size:13px;color:#D0D0D0} .card .note,.tcol .note{color:var(--muted)}
.warn-t{color:#A01010!important} .ok-t{color:#1E6B10!important}
@media (max-width:600px){
  h1{font-size:26px} .mc-title{font-size:30px} .qtext{font-size:19px} .board{grid-template-columns:1fr}
  .bar{grid-template-columns:166px 1fr 30px;font-size:13px}
}
@media print{.thead,.tabs,.btn{display:none!important}}
</style>
</head>

<script>

const LS_DB='tm_demo_db_v1';
const DB = {
  demo:true, fb:null, L:[],
  async init(){
    if(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.databaseURL){
      try{
        await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
        await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js');
        firebase.initializeApp(FIREBASE_CONFIG); this.fb=firebase.database(); this.demo=false;
      }catch(e){console.error(e);toast('Firebase 연결 실패 → 데모 모드로 실행해요',3500)}
    }
    if(this.demo){
      window.addEventListener('storage',e=>{if(e.key===LS_DB)this._emit()});
      try{this.bc=new BroadcastChannel('tm_demo');this.bc.onmessage=()=>this._emit()}catch{}
    }
  },
  _read(){try{return JSON.parse(localStorage.getItem(LS_DB))||{}}catch{return {}}},
  _write(d){localStorage.setItem(LS_DB,JSON.stringify(d));this._emit();try{this.bc&&this.bc.postMessage(1)}catch{}},
  _emit(){const d=this._read();this.L.forEach(l=>{const v=JSON.stringify(getAt(d,l.path));if(v!==l.last){l.last=v;l.cb(JSON.parse(v))}})},
  ref(p){return this.fb.ref(p?ROOT+'/'+p:ROOT)},
  on(path,cb){
    if(!this.demo){const r=this.ref(path);const h=s=>cb(s.val());r.on('value',h);return ()=>r.off('value',h)}
    const l={path,cb,last:undefined};this.L.push(l);const v=JSON.stringify(getAt(this._read(),path));l.last=v;cb(JSON.parse(v));
    return ()=>{this.L=this.L.filter(x=>x!==l)};
  },
  async get(path){if(!this.demo)return (await this.ref(path).get()).val();return clone(getAt(this._read(),path))},
  set(path,val){if(!this.demo)return this.ref(path).set(val);const d=this._read();setAt(d,path,val);this._write(d);return Promise.resolve()},
  update(path,obj){if(!this.demo)return this.ref(path).update(obj);const d=this._read();for(const [k,v] of Object.entries(obj))setAt(d,path?path+'/'+k:k,v);this._write(d);return Promise.resolve()}
};

   🧮 점수 · 팀 편성 알고리즘
   ===================================================================== */
function scoreAnswers(ans){ // ans: 'YNYN...'
  const raw={};ROLE_IDS.forEach(r=>raw[r]=0);
  [...ans].forEach((a,i)=>{const pick=a==='Y'?QUESTIONS[i].y:QUESTIONS[i].n;for(const r in pick)raw[r]+=pick[r]});
  const norm={};ROLE_IDS.forEach(r=>norm[r]=raw[r]/MAXS[r]);
  const top=Math.max(...ROLE_IDS.map(r=>norm[r]));
  const role=shuffle(ROLE_IDS.filter(r=>Math.abs(norm[r]-top)<1e-9))[0]; // 동점이면 랜덤
  return {raw,norm,role};
}
// 팀 안에서 역할이 겹치지 않도록 '성향 점수 합'이 최대가 되는 배치를 찾음
function assignRoles(members){ // [{sid,norm,role}]
  const out={};if(!members.length)return out;
  const noise={};members.forEach(m=>ROLE_IDS.forEach(r=>noise[m.sid+r]=Math.random()*0.01));
  const sc=(m,r)=>((m.norm&&m.norm[r])||0)+(m.role===r?0.35:0)+noise[m.sid+r];
  const head=shuffle(members).slice(0,6);
  let best=-1,bestAsg=null;
  const rec=(i,used,sum,asg)=>{
    if(i===head.length){if(sum>best){best=sum;bestAsg=[...asg]}return}
    for(const r of ROLE_IDS){if(used.has(r))continue;used.add(r);asg.push(r);rec(i+1,used,sum+sc(head[i],r),asg);asg.pop();used.delete(r)}
  };
  rec(0,new Set(),0,[]);
  head.forEach((m,i)=>out[m.sid]=bestAsg[i]);
  members.forEach(m=>{if(!out[m.sid])out[m.sid]=m.role||'cheer'}); // 7명 이상인 팀의 추가 인원
  return out;
}
function buildTeams(students,count){
  const done=students.filter(s=>s.status==='done'&&s.role);
  const teams=Array.from({length:count},()=>({list:[],rc:{}}));
  const byRole={};ROLE_IDS.forEach(r=>byRole[r]=shuffle(done.filter(s=>s.role===r)));
  // 인원이 많은 성향부터 → 가장 인원이 적고, 같은 성향이 적은 팀으로 배치
  const order=ROLE_IDS.slice().sort((a,b)=>byRole[b].length-byRole[a].length);
  for(const r of order)for(const s of byRole[r]){
    let best=null,bk=null;
    shuffle(teams).forEach(t=>{const k=[t.list.length,t.rc[r]||0];if(!best||k[0]<bk[0]||(k[0]===bk[0]&&k[1]<bk[1])){best=t;bk=k}});
    best.list.push(s);best.rc[r]=(best.rc[r]||0)+1;
  }
  const names=shuffle(TEAM_ANIMALS);
  const out={};
  teams.forEach((t,i)=>{const [e,n]=names[i%names.length];out['t'+(i+1)]={no:i+1,e,name:`${n} 원정대`,members:assignRoles(t.list)}});
  return out;
}

function makeTextures(){
  const tex=(draw)=>{const c=document.createElement('canvas');c.width=c.height=16;const g=c.getContext('2d');let seed=7;
    const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
    for(let y=0;y<16;y++)for(let x=0;x<16;x++){g.fillStyle=draw(x,y,rnd);g.fillRect(x,y,1,1)}return `url(${c.toDataURL()})`};
  const pick=(a,r)=>a[Math.floor(r()*a.length)];
  const dirt=['#6B4A2F','#5B3E2B','#7A5636','#4E3422','#8A643F'];
  const grass=['#5DA03A','#6CB244','#4E8F2E','#79BF4D'];
  const stone=['#7F7F7F','#747474','#8C8C8C','#6A6A6A','#999999'];
  const root=document.documentElement.style;
  root.setProperty('--tex-dirt',tex((x,y,r)=>pick(dirt,r)));
  const edge=[3,4,3,2,3,4,5,4,3,3,2,3,4,4,3,2];
  root.setProperty('--tex-grass',tex((x,y,r)=>y<edge[x]?pick(grass,r):pick(dirt,r)));
  root.setProperty('--tex-stone',tex((x,y,r)=>pick(stone,r)));
}

function myTeam(d){const teams=d.teams||{};for(const tid in teams){if(teams[tid].members&&teams[tid].members[S.sid])return [tid,teams[tid]]}return [null,null]}
function teamProgress(d,tid,team){
  const mem=Object.keys((team&&team.members)||{});
  const ms=((d.missions||{})[tid])||{};const rounds=ms.rounds||{};
  let cleared=0;
  for(const rid in rounds){const ch=rounds[rid].checks||{};if(mem.length&&mem.every(s=>ch[s]))cleared++}
  const bonus=((d.bonus||{})[tid])||0;
  const cur=ms.cur&&rounds[ms.cur]?{rid:ms.cur,...rounds[ms.cur]}:null;
  const curDone=cur?mem.filter(s=>(cur.checks||{})[s]).length:0;
  return {stars:cleared+bonus,cleared,bonus,cur,curDone,total:mem.length,mem};
}
function classStars(d){let t=0;for(const tid in (d.teams||{}))t+=teamProgress(d,tid,d.teams[tid]).stars;return t}
function goalHTML(d){
  const goal=d.goal||10,have=classStars(d),p=Math.min(100,Math.round(have/goal*100));

    <div class="gauge blue"><div class="fill" style="width:${p}%"></div><div class="lbl">⭐ ${have} / ${goal}</div></div></div></div></div>`;

function renderTeam(first){

  }
  const myRole=team.members[S.sid];const R=ROLES[myRole]||ROLES.cheer;

  const studs=d.students||{};

  const M=P.cur?MISSION_BY_ID[P.cur.mid]:null;
  const checks=(P.cur&&P.cur.checks)||{};
  const iDid=!!checks[S.sid];
  const curPct=P.total?Math.round(P.curDone/P.total*100):0;
  const lvPct=L.next?Math.round((P.stars-L.min)/(L.next.min-L.min)*100):100;

  // 새 미션 슬롯 연출
  const seenMKey=`tm_seenMission_${S.room}_${tid}`;

  }

function addBots(d){
  const n=parseInt(prompt('가상 학생 몇 명을 추가할까요? (팀 편성 연습용)','20'),10);if(!n||n<1)return;

  while(added<n&&num<100){if(!used.has(num)){const ans=Array.from({length:QUESTIONS.length},()=>Math.random()<.5?'Y':'N').join('');const sc=scoreAnswers(ans);
    up['n'+String(num).padStart(2,'0')]={num,name:fam[Math.floor(Math.random()*fam.length)]+giv[Math.floor(Math.random()*giv.length)],status:'done',answers:ans,raw:sc.raw,norm:sc.norm,role:sc.role,bot:true,joinedAt:Date.now()};added++}num++}
  DB.update(`rooms/${TS.room}/students`,up);toast(`🤖 가상 학생 ${added}명 추가!`);
}

        <div class="miss">${dups.length?`<span class="warn">겹침: ${dups.map(r=>ROLES[r].e).join(' ')}</span> · `:''}${missing.length&&list.length?`빈 역할: ${missing.map(r=>ROLES[r].e).join(' ')}`:''}</div>
        <div class="chips">${list.map(s=>chip(s,mem[s.sid]).replace('class="chip"',`class="chip ${rc[mem[s.sid]]>1?'dup':''}"`)).join('')}</div>
        <div class="row" style="margin-top:10px"><button class="btn sm" data-reopt="${tid}">🔄 역할 자동 재배치</button>
          ${list.length?'':`<button class="btn sm" data-deltm="${tid}">🗑 팀 삭제</button>`}</div>
      </div>`}).join('')}
      <div class="tcol pool" data-drop="pool"><h3>📥 미배정 <span class="grow"></span><span class="pill">${pool.length}명</span></h3>
        <div class="miss">여기로 끌어오면 팀에서 빠져요</div>
        <div class="chips">${pool.map(s=>chip(s,null)).join('')}</div>
        <div class="row" style="margin-top:10px"><button class="btn sm" id="addTeam">＋ 빈 팀 추가</button></div></div>
    </div>`
    :`<div class="card center" style="padding:34px"><div style="font-size:50px">🎲</div><h3 style="margin-top:8px">아직 팀이 없어요</h3>
      <p class="muted" style="font-weight:700;margin-top:6px">학생들이 테스트를 마치면 <b>팀 수</b>를 정하고 <b>🎲 팀 배정</b>을 눌러 주세요.<br>성향이 몰리지 않게 골고루 섞고, 팀 안에서는 역할이 겹치지 않게 배치해요.</p></div>`}
  </div>`;
  let tc=defCount;
  const setTc=v=>{tc=Math.max(1,Math.min(12,v));$('#tcVal').textContent=tc;DB.set(`rooms/${TS.room}/teamCount`,tc)};
  $('#tcMinus').onclick=()=>setTc(tc-1);$('#tcPlus').onclick=()=>setTc(tc+1);
  $('#doAssign').onclick=()=>{
    if(!done.length)return toast('테스트를 마친 학생이 없어요');
    if(tids.length&&!confirm('지금 팀 구성을 지우고 새로 배정할까요?'))return;
    if(tc>done.length)return toast('팀 수가 학생 수보다 많아요');
    const t=buildTeams(done,tc);
    DB.update(`rooms/${TS.room}`,{teams:t,missions:null,bonus:null,revealed:false});
    toast('🎲 팀 배정 완료! 확인 후 공개해 주세요');
  };
  const rb=$('#revealBtn');if(rb)rb.onclick=()=>{
    const empty=tids.filter(t=>!Object.keys(teams[t].members||{}).length);
    if(pool.filter(s=>s.status==='done').length&&!confirm(`미배정 학생이 ${pool.filter(s=>s.status==='done').length}명 있어요. 그래도 공개할까요?`))return;
    if(empty.length&&!confirm('빈 팀이 있어요. 그래도 공개할까요?'))return;
    DB.update(`rooms/${TS.room}`,{revealed:true,revealAt:Date.now()});confetti(60);toast('👀 모든 학생 화면에 팀이 공개됐어요!');
  };
  const hb=$('#hideBtn');if(hb)hb.onclick=()=>{DB.set(`rooms/${TS.room}/revealed`,false);toast('학생 화면에서 팀을 숨겼어요')};
  $$('.rsel').forEach(sel=>{sel.onpointerdown=e=>e.stopPropagation();sel.onchange=()=>{
    const tid=sel.closest('[data-drop]').dataset.drop;DB.set(`rooms/${TS.room}/teams/${tid}/members/${sel.dataset.sid}`,sel.value)}});
  $$('[data-reopt]').forEach(b=>b.onclick=()=>{const tid=b.dataset.reopt;const mem=teams[tid].members||{};
    const asg=assignRoles(Object.keys(mem).map(sid=>({sid,...(studs[sid]||{})})));DB.set(`rooms/${TS.room}/teams/${tid}/members`,asg);toast('역할을 다시 배치했어요')});
  $$('[data-deltm]').forEach(b=>b.onclick=()=>DB.set(`rooms/${TS.room}/teams/${b.dataset.deltm}`,null));
  const at=$('#addTeam');if(at)at.onclick=()=>{
    const no=Math.max(0,...tids.map(t=>teams[t].no))+1;const usedE=new Set(tids.map(t=>teams[t].e));
    const [e,n]=TEAM_ANIMALS.find(([e])=>!usedE.has(e))||TEAM_ANIMALS[no%TEAM_ANIMALS.length];
    DB.set(`rooms/${TS.room}/teams/t${Date.now().toString(36)}`,{no,e,name:`${n} 원정대`,members:null})};
  $$('.chip[data-sid]').forEach(c=>c.addEventListener('pointerdown',e=>startDrag(c,e)));
}
function bestFreeRole(stu,mem){
  const used=new Set(Object.values(mem||{}));
  const order=ROLE_IDS.slice().sort((a,b)=>((stu.norm||{})[b]||0)+(stu.role===b?1:0)-((stu.norm||{})[a]||0)-(stu.role===a?1:0));
  return order.find(r=>!used.has(r))||stu.role||'cheer';
}
function moveStudent(sid,from,to){
  const d=TS.data;const teams=d.teams||{};const stu=(d.students||{})[sid]||{};
  const up={};
  if(from!=='pool')up[`teams/${from}/members/${sid}`]=null;
  if(to!=='pool'){
    const cur=from!=='pool'?teams[from].members[sid]:null;
    const tm={...(teams[to].members||{})};
    up[`teams/${to}/members/${sid}`]=(cur&&!Object.values(tm).includes(cur))?cur:bestFreeRole(stu,tm);
  }
  DB.update(`rooms/${TS.room}`,up);
}
function startDrag(chip,e){
  if(e.button!==undefined&&e.button!==0)return;
  const sid=chip.dataset.sid;const from=chip.closest('[data-drop]').dataset.drop;
  const sx=e.clientX,sy=e.clientY;let ghost=null,over=null;
  const rect=chip.getBoundingClientRect();const ox=sx-rect.left,oy=sy-rect.top;
  const move=ev=>{
    if(!ghost){if(Math.hypot(ev.clientX-sx,ev.clientY-sy)<6)return;
      TS.dragging=true;ghost=chip.cloneNode(true);ghost.classList.add('ghost');ghost.style.width=rect.width+'px';document.body.appendChild(ghost);chip.classList.add('src')}
    ev.preventDefault();
    ghost.style.left=(ev.clientX-ox)+'px';ghost.style.top=(ev.clientY-oy)+'px';
    const el=document.elementFromPoint(ev.clientX,ev.clientY);const z=el&&el.closest('[data-drop]');
    if(z!==over){over&&over.classList.remove('over');over=z;over&&over.classList.add('over')}
    if(ev.clientY<60)window.scrollBy(0,-14);else if(ev.clientY>innerHeight-60)window.scrollBy(0,14);
  };
  const end=()=>{
    window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',end);window.removeEventListener('pointercancel',end);
    if(ghost){ghost.remove();chip.classList.remove('src');over&&over.classList.remove('over');
      const to=over&&over.dataset.drop;
      TS.dragging=false;
      if(to&&to!==from)moveStudent(sid,from,to);
      if(TS.pending){TS.pending=false;renderTeacher()}
    }
  };
  window.addEventListener('pointermove',move,{passive:false});window.addEventListener('pointerup',end);window.addEventListener('pointercancel',end);
}

/* --- ③ 협력 미션 --- */
function tabMission(d){
  const teams=d.teams||{};const studs=d.students||{};
  const tids=Object.keys(teams).sort((a,b)=>teams[a].no-teams[b].no).filter(t=>Object.keys(teams[t].members||{}).length);
  if(!tids.length){$('#tbody').innerHTML=`<div class="card center" style="padding:34px"><div style="font-size:50px">🧩</div><h3 style="margin-top:8px">먼저 팀을 편성해 주세요</h3>
    <button class="btn yellow" style="margin-top:14px" onclick="TS.tab='team';renderTeacher()">② 팀 편성으로 →</button></div>`;return}
  const goal=d.goal||10;
  $('#tbody').innerHTML=`<div class="stack">
    <div class="card"><div class="row between">
      <div><h3>🎲 협력 미션 뽑기</h3><p class="note" style="margin-top:4px">팀마다 다른 미션이 랜덤으로 배정돼요. 각 팀원은 자기 역할의 미션을 완료하고 체크! <b>팀원 모두</b> 완료하면 ⭐ +1</p></div>
      <div class="row"><button class="btn big yellow" style="width:auto" id="drawAll">🎲 전체 팀 미션 뽑기</button></div></div>
      ${d.revealed?'':'<p class="note warn-t" style="margin-top:8px">⚠ 팀이 아직 학생들에게 공개되지 않았어요. 학생들은 공개 후에 미션을 볼 수 있어요.</p>'}
    </div>
    <div class="card"><div class="row between"><div class="grow" style="min-width:240px">${goalHTML(d).replace(/^<div class="card">|<\/div>$/g,'')}</div>
      <div class="row"><span class="note">목표 ⭐</span><button class="btn sm" id="gMinus">－</button><b>${goal}</b><button class="btn sm" id="gPlus">＋</button></div></div></div>
    <div class="board">${tids.map(tid=>{const t=teams[tid];const P=teamProgress(d,tid,t);const L=levelOf(P.stars);const M=P.cur?MISSION_BY_ID[P.cur.mid]:null;
      const ch=(P.cur&&P.cur.checks)||{};const pct=P.total?Math.round(P.curDone/P.total*100):0;
      const mates=sortStudents(P.mem.map(s=>({sid:s,...(studs[s]||{name:'?'}),r:t.members[s]})));
      return `<div class="card tmcard">
        <div class="row between"><h3><span style="font-size:24px">${t.e}</span> ${t.no}모둠 · ${esc(t.name)}</h3><span class="pill" style="font-size:15px">⭐ ${P.stars}</span></div>
        <div class="row" style="margin-top:6px"><span style="font-size:30px">${L.e}</span><b>Lv.${L.idx+1} ${L.n}</b><span class="note">(클리어 ${P.cleared} · 보너스 ${P.bonus})</span></div>
        ${M?`<div class="cur"><div style="font-weight:900">${M.e} ${M.t}</div><div class="note" style="margin-top:2px">${M.d}</div>
          <div class="gauge green" style="margin-top:8px"><div class="fill" style="width:${pct}%"></div><div class="lbl">${pct===100?'🎉 클리어!':`${P.curDone}/${P.total}`}</div></div>
          <div class="mchips">${mates.map(m=>`<button class="mchip ${ch[m.sid]?'ok':''}" data-chk="${tid}|${P.cur.rid}|${m.sid}" title="${esc((M.tasks[m.r]||''))}">${(ROLES[m.r]||ROLES.cheer).e} ${esc(m.name)}</button>`).join('')}</div></div>`
          :`<div class="cur note">아직 미션이 없어요</div>`}
        <div class="row"><button class="btn sm" data-draw="${tid}">🎲 이 팀만 ${M?'새 미션':'뽑기'}</button>
          <span class="grow"></span><button class="btn sm" data-bonus="${tid}|1" title="보너스 별">⭐+1</button><button class="btn sm" data-bonus="${tid}|-1" title="보너스 별 빼기">⭐−1</button></div>
      </div>`}).join('')}</div>
    <div class="row" style="justify-content:flex-end"><button class="btn sm red" id="resetMissions">🧹 미션·별 기록 초기화</button></div>
  </div>`;
  $('#drawAll').onclick=()=>drawMissions(tids,true);
  $$('[data-draw]').forEach(b=>b.onclick=()=>drawMissions([b.dataset.draw],false));
  $$('[data-chk]').forEach(b=>b.onclick=()=>{const [tid,rid,sid]=b.dataset.chk.split('|');const v=(((d.missions[tid]||{}).rounds||{})[rid]||{}).checks||{};
    DB.set(`rooms/${TS.room}/missions/${tid}/rounds/${rid}/checks/${sid}`,v[sid]?null:true)});
  $$('[data-bonus]').forEach(b=>b.onclick=()=>{const [tid,v]=b.dataset.bonus.split('|');const cur=((d.bonus||{})[tid])||0;DB.set(`rooms/${TS.room}/bonus/${tid}`,Math.max(0,cur+(+v)))});
  $('#gMinus').onclick=()=>DB.set(`rooms/${TS.room}/goal`,Math.max(1,goal-1));
  $('#gPlus').onclick=()=>DB.set(`rooms/${TS.room}/goal`,goal+1);
  $('#resetMissions').onclick=()=>{if(confirm('모든 팀의 미션과 별 기록을 지울까요?'))DB.update(`rooms/${TS.room}`,{missions:null,bonus:null})};
}
function pickMissions(d,tids){
  const res={};const takenNow=new Set();
  tids.forEach(tid=>{
    const rounds=(((d.missions||{})[tid]||{}).rounds)||{};
    const usedByTeam=new Set(Object.values(rounds).map(r=>r.mid));
    let cand=MISSIONS.filter(m=>!usedByTeam.has(m.id)&&!takenNow.has(m.id));
    if(!cand.length)cand=MISSIONS.filter(m=>!usedByTeam.has(m.id));
    if(!cand.length)cand=MISSIONS.filter(m=>m.id!==(rounds[((d.missions||{})[tid]||{}).cur]||{}).mid);
    const m=shuffle(cand)[0];takenNow.add(m.id);res[tid]=m;
  });
  return res;
}
async function drawMissions(tids,all){
  const d=TS.data;const teams=d.teams;
  const pending=tids.filter(tid=>{const P=teamProgress(d,tid,teams[tid]);return P.cur&&P.curDone<P.total});
  if(pending.length&&!confirm(`아직 미션을 다 못 끝낸 팀이 ${pending.length}팀 있어요. 새 미션을 뽑을까요?\n(못 끝낸 미션은 ⭐ 없이 넘어가요)`))return;
  const picks=pickMissions(d,tids);
  // 교사 화면 슬롯 연출
  overlay(`<div class="tslot pop"><div class="row between"><h2>🎲 협력 미션 뽑기!</h2><button class="btn sm" id="tsClose" style="visibility:hidden">닫기 ✕</button></div>
    <div class="tslot-grid">${tids.map(tid=>`<div class="tslot-cell rolling" id="ts_${tid}"><div class="note" style="font-weight:900">${teams[tid].e} ${teams[tid].no}모둠</div><div class="se">❔</div><div class="st">…</div></div>`).join('')}</div></div>`);
  let stopped=0;const t0=Date.now();
  await new Promise(res=>{
    const tick=()=>{
      tids.forEach((tid,i)=>{const cell=$('#ts_'+tid);if(!cell||cell.classList.contains('landed'))return;
        if(Date.now()-t0>1200+i*450){const m=picks[tid];cell.classList.remove('rolling');cell.classList.add('landed');cell.innerHTML=`<div class="note" style="font-weight:700">${teams[tid].e} ${teams[tid].no}모둠</div><div class="se">${m.e}</div><div class="st">${m.t}</div><div class="note" style="margin-top:4px">${m.d}</div>`;stopped++}
        else{const m=MISSIONS[Math.floor(Math.random()*MISSIONS.length)];cell.querySelector('.se').textContent=m.e;cell.querySelector('.st').textContent=m.t}});
      if(stopped<tids.length)setTimeout(tick,80);else res();
    };tick();
  });
  confetti(70);
  const btn=$('#tsClose');if(btn){btn.style.visibility='visible';btn.onclick=closeOverlay}
  const up={};const now=Date.now();
  tids.forEach((tid,i)=>{const rid='r'+(now+i).toString(36);up[`missions/${tid}/rounds/${rid}`]={mid:picks[tid].id,at:now};up[`missions/${tid}/cur`]=rid});
  await DB.update(`rooms/${TS.room}`,up);
}

boot();
</script>
