<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>팀워크 메이커</title>
<meta name="description" content="모둠 역할 성향 테스트 → 균형 팀 편성 → 협력 미션까지! 우리 반 팀워크 메이커">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* =====================================================================
   🧱 블록 월드 테마
   - 제목·버튼: Galmuri11 픽셀 폰트 (SIL OFL, fonts/ 폴더)
   - 본문: Pretendard (가독성)
   - 아이콘·블록 텍스처: 코드로 직접 그린 16×16 픽셀 아트
   ===================================================================== */
@font-face{font-family:'Galmuri11';font-weight:400;font-display:swap;
  src:url('fonts/Galmuri11.woff2') format('woff2'),url('https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/Galmuri11.woff2') format('woff2')}
@font-face{font-family:'Galmuri11';font-weight:700;font-display:swap;
  src:url('fonts/Galmuri11-Bold.woff2') format('woff2'),url('https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/Galmuri11-Bold.woff2') format('woff2')}
:root{
  --pixel:'Galmuri11',ui-monospace,monospace;
  --sans:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --text:#1D1D1D; --sub:#4A4A4A; --edge:#1D1D1D;
  --panel:#F3F3F3; --panel-hi:#FFFFFF; --panel-lo:#A9A9A9;
  --slot:#C9C9C9; --slot-lo:#8A8A8A; --slot-hi:#F2F2F2;
  --grass:#5FAE36; --grass-d:#3F7F22; --sky1:#5BB3F0; --sky2:#BFE6FF;
  --gold:#F4C430; --red:#D9483B; --blue:#3D7DD8;
  --tex-grass-top:none; --tex-grass-side:none; --tex-stone:none;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
html{background:#BFE6FF}
body{font-family:var(--sans);color:var(--text);font-size:16px;line-height:1.6;word-break:keep-all;
  background:linear-gradient(180deg,var(--sky1) 0%,#86CBF5 45%,var(--sky2) 100%) fixed;}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,select{font:inherit;color:inherit}
img.px{image-rendering:pixelated;image-rendering:crisp-edges;display:inline-block;vertical-align:middle;flex:none}
#app{min-height:100%;display:flex;flex-direction:column;position:relative;z-index:1}
#app::after{content:'';display:block;margin-top:auto;height:72px;flex:none;
  background:var(--tex-grass-side) #5FAE36;background-size:72px 72px;background-repeat:repeat-x;border-top:4px solid var(--grass-d);image-rendering:pixelated}

/* 구름 */
#sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.cloud{position:absolute;height:28px;background:#fff;opacity:.92;box-shadow:0 6px 0 rgba(255,255,255,.55);animation:drift linear infinite}
.cloud::before,.cloud::after{content:'';position:absolute;background:#fff;height:28px;top:-24px}
.cloud::before{left:20%;width:35%} .cloud::after{left:48%;width:28%;top:-14px}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}

.wrap{width:100%;max-width:580px;margin:0 auto;padding:22px 16px 36px}
.wide{max-width:1300px}

/* 패널: 블록 GUI */
.card{background:var(--panel);color:var(--text);border:3px solid var(--edge);padding:20px;
  box-shadow:inset 4px 4px 0 var(--panel-hi),inset -4px -4px 0 var(--panel-lo),6px 6px 0 rgba(0,0,0,.28)}
.card.grass{padding-top:34px;position:relative}
.card.grass::before{content:'';position:absolute;left:0;right:0;top:0;height:18px;background:var(--tex-grass-top) var(--grass);background-size:36px 36px;border-bottom:3px solid var(--grass-d);image-rendering:pixelated}
.card.dark{background:#3B3B3B;color:#fff;box-shadow:inset 4px 4px 0 #5A5A5A,inset -4px -4px 0 #232323,6px 6px 0 rgba(0,0,0,.28)}
.card.dark .sub{color:#E2E2E2}
.slotbg{background:var(--slot);border:3px solid var(--edge);box-shadow:inset 3px 3px 0 var(--slot-lo),inset -3px -3px 0 var(--slot-hi)}

/* 텍스트 */
h1,h2,.btn,.tab,.qnum,.role-name,.tname,.count,.mc-title{font-family:var(--pixel);font-weight:700;letter-spacing:0}
h1{font-size:30px;line-height:1.3}
h2{font-size:24px;line-height:1.35}
h3{font-size:18px;font-weight:800;line-height:1.4}
.sub{color:var(--sub);font-weight:600}
.note{font-size:14px;color:var(--sub);font-weight:600}
.center{text-align:center} .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between} .grow{flex:1}
.stack>*+*{margin-top:16px}
.warn-t{color:#B3261E!important} .ok-t{color:#2E7D1E!important}
.ico-h{display:inline-flex;align-items:center;gap:8px}

/* 메인 타이틀: 돌 질감의 입체 블록 글자 */
.mc-title{font-size:44px;line-height:1.15;
  background:linear-gradient(180deg,#F7F7F7 0%,#D4D4D4 48%,#9C9C9C 52%,#B9B9B9 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(2px 0 0 #222) drop-shadow(-2px 0 0 #222) drop-shadow(0 2px 0 #222) drop-shadow(0 -2px 0 #222) drop-shadow(0 5px 0 #3A3A3A) drop-shadow(3px 5px 0 rgba(0,0,0,.3))}
.splash{display:inline-block;font-family:var(--pixel);font-weight:700;color:#FFF24A;font-size:17px;transform:rotate(-8deg);
  text-shadow:2px 2px 0 #4A4100;animation:splash .55s ease-in-out infinite alternate;margin-top:6px}
@keyframes splash{to{transform:rotate(-8deg) scale(1.1)}}

/* 버튼: 블록 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border:3px solid var(--edge);background:#8F8F8F;color:#fff;font-size:16px;
  text-shadow:2px 2px 0 rgba(0,0,0,.45);user-select:none;white-space:nowrap;
  box-shadow:inset 3px 3px 0 rgba(255,255,255,.45),inset -3px -3px 0 rgba(0,0,0,.35),0 4px 0 rgba(0,0,0,.35);transition:transform .06s,filter .06s}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:translateY(3px);box-shadow:inset 3px 3px 0 rgba(0,0,0,.3),inset -3px -3px 0 rgba(255,255,255,.3),0 1px 0 rgba(0,0,0,.35)}
.btn:disabled{filter:grayscale(1) brightness(.85);cursor:not-allowed;opacity:.7}
.btn.big{width:100%;padding:15px;font-size:19px}
.btn.sm{padding:6px 11px;font-size:14px;border-width:2px;box-shadow:inset 2px 2px 0 rgba(255,255,255,.45),inset -2px -2px 0 rgba(0,0,0,.35),0 3px 0 rgba(0,0,0,.3)}
.btn.yellow{background:var(--gold);color:#2B2000;text-shadow:1px 1px 0 rgba(255,255,255,.5)}
.btn.green{background:var(--grass)} .btn.red{background:var(--red)} .btn.blue{background:var(--blue)}
.btn.light{background:#E6E6E6;color:var(--text);text-shadow:none}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent;text-decoration:underline;color:var(--sub);text-shadow:none;font-family:var(--sans);font-weight:700}
.on-sky>.center .btn.ghost{color:#0E3B66}

/* 입력 */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-weight:800;font-size:15px}
.input{width:100%;padding:12px 13px;border:3px solid var(--edge);background:#fff;font-size:17px;font-weight:600;outline:none;box-shadow:inset 3px 3px 0 #D6D6D6}
.input:focus{background:#FFFBE0}

/* 작은 라벨 */
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border:2px solid var(--edge);font-size:13.5px;font-weight:800;background:#fff;color:var(--text);white-space:nowrap}
.rtag{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 6px;border:2px solid var(--edge);border-left-width:8px;font-weight:800;font-size:14.5px;white-space:nowrap;background:#fff;color:var(--text)}
/* 첫 화면 역할 소개 */
.roles-box h3{text-align:center;margin-bottom:12px}
.roles-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.role-item{display:flex;align-items:center;gap:10px;padding:8px 10px;background:#fff;border:3px solid var(--edge);border-left-width:10px;box-shadow:inset -3px -3px 0 #D6D6D6}
.role-item .ic{width:48px;height:48px;display:flex;align-items:center;justify-content:center;flex:none}
.role-item .nm{font-size:18px;font-weight:800;line-height:1.3}
.role-item .jb{font-size:14px;font-weight:700;color:var(--sub);line-height:1.3}
@media (max-width:480px){.roles-grid{grid-template-columns:1fr}.role-item .nm{font-size:19px}}
.legend{display:flex;flex-wrap:wrap;gap:6px}

/* 3D 블록 */
.cube-wrap{perspective:600px;display:flex;justify-content:center;align-items:center}
.cube{--s:96px;width:var(--s);height:var(--s);position:relative;transform-style:preserve-3d;transform:rotateX(-24deg) rotateY(-35deg);animation:turn 9s linear infinite}
.cube.still{animation:none}
@keyframes turn{from{transform:rotateX(-24deg) rotateY(0)}to{transform:rotateX(-24deg) rotateY(360deg)}}
.cube i{position:absolute;inset:0;background-size:100% 100%;image-rendering:pixelated;outline:2px solid rgba(0,0,0,.55);outline-offset:-1px}
.cube .ft{transform:translateZ(calc(var(--s)/2))}
.cube .bk{transform:rotateY(180deg) translateZ(calc(var(--s)/2))}
.cube .rt{transform:rotateY(90deg) translateZ(calc(var(--s)/2));filter:brightness(.8)}
.cube .lf{transform:rotateY(-90deg) translateZ(calc(var(--s)/2));filter:brightness(.8)}
.cube .tp{transform:rotateX(90deg) translateZ(calc(var(--s)/2));filter:brightness(1.12)}
.cube .bt{transform:rotateX(-90deg) translateZ(calc(var(--s)/2));filter:brightness(.6)}

@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes slideIn{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.pop{animation:pop .3s steps(5) both}
.slide{animation:slideIn .3s steps(6) both}
.demo-bar{background:#26173D;color:#FFF07A;font-size:13.5px;font-weight:700;padding:7px 12px;text-align:center;border-bottom:3px solid #000;position:relative;z-index:2}
.demo-bar b{color:#fff}

/* ---------- 학생: 퀴즈 ---------- */
.qtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px}
.dots{display:flex;gap:4px}
.dots i{width:16px;height:16px;border:2px solid var(--edge);background:#E6E6E6;display:block;box-shadow:inset 2px 2px 0 #B5B5B5}
.dots i.on{background:var(--grass);box-shadow:inset 2px 2px 0 rgba(255,255,255,.4)}
.dots i.cur{background:var(--gold);transform:scale(1.2)}
.qcard{text-align:center;padding:28px 20px 26px;min-height:320px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:16px}
.qnum{font-size:14px;background:#3B3B3B;color:#FFF07A;padding:5px 12px;border:2px solid #000}
.qicon{width:120px;height:120px;display:flex;align-items:center;justify-content:center}
.qtext{font-size:23px;font-weight:800;line-height:1.55;white-space:pre-line}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.yn .btn{padding:16px 10px;font-size:24px;flex-direction:column;gap:2px}
.yn .btn small{font-size:14px;font-family:var(--sans);font-weight:700;text-shadow:none;opacity:.95}
.analyzing{text-align:center;padding:30px 20px 40px}

/* ---------- 역할 카드 ---------- */
.rolecard{position:relative;overflow:hidden;text-align:center;padding:24px 20px}
.rolecard .band{position:absolute;inset:0 0 auto 0;height:100px;border-bottom:3px solid var(--edge);box-shadow:inset 0 -6px 0 rgba(0,0,0,.18)}
.rolecard .inner{position:relative}
.role-icon{width:112px;height:112px;margin:0 auto;display:flex;align-items:center;justify-content:center}
.role-name{font-size:32px;margin-top:10px}
.traits{text-align:left;margin-top:16px;display:grid;gap:6px}
.traits div{padding:9px 12px 9px 10px;font-size:15.5px;font-weight:700;display:flex;gap:8px;align-items:center;background:#E4E4E4;border:2px solid var(--edge);box-shadow:inset 2px 2px 0 #fff,inset -2px -2px 0 #B0B0B0}
.tip{margin-top:14px;padding:12px 14px;border:3px solid #6B4A2F;background:#FFF4D2;font-size:15.5px;font-weight:700;text-align:left;display:flex;gap:10px;align-items:flex-start;box-shadow:inset 3px 3px 0 #FFFBEA}
.bars{display:grid;gap:8px;margin-top:8px}
.bar{display:grid;grid-template-columns:190px 1fr 40px;align-items:center;gap:8px;font-size:15px;font-weight:700}
.bar>span:first-child{display:flex;align-items:center;gap:6px;white-space:nowrap}
.bar>span:last-child{text-align:right}
.track{height:16px;border:2px solid var(--edge);background:#3B3B3B;overflow:hidden}
.track .fill{height:100%;border-right:2px solid var(--edge);box-shadow:inset 0 4px 0 rgba(255,255,255,.35);transition:width .8s steps(12)}
.waiting{display:flex;align-items:center;gap:12px;font-weight:800;font-size:17px}
.dotdot span{animation:blink 1.2s steps(1) infinite;display:inline-block}
.dotdot span:nth-child(2){animation-delay:.3s}.dotdot span:nth-child(3){animation-delay:.6s}
@keyframes blink{50%{opacity:0}}
.tasklist{display:grid;gap:8px;margin-top:12px;text-align:left}
.tasklist div{display:flex;gap:10px;align-items:flex-start;font-size:16px;font-weight:600}
.tasklist b{flex:none;width:26px;height:26px;border:2px solid var(--edge);display:flex;align-items:center;justify-content:center;font-family:var(--pixel);font-size:14px;background:var(--gold);box-shadow:inset -2px -2px 0 rgba(0,0,0,.25)}

/* ---------- 학생: 팀 / 미션 ---------- */
.teambanner{text-align:center}
.tname{font-size:28px;margin-top:6px}
.level{display:flex;align-items:center;gap:12px;margin-top:16px;text-align:left}
.level .mon{width:72px;height:72px;display:flex;align-items:center;justify-content:center;flex:none}
.gauge{height:24px;border:3px solid var(--edge);background:#2A2A2A;overflow:hidden;position:relative}
.gauge::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),rgba(0,0,0,.6) calc(10% - 2px) 10%);pointer-events:none}
.gauge .fill{height:100%;background:#8FE03C;box-shadow:inset 0 4px 0 #C6FF86,inset 0 -4px 0 #5C9E1E;transition:width .9s steps(12)}
.gauge.green .fill{background:#45C95A;box-shadow:inset 0 4px 0 #9BFFA5,inset 0 -4px 0 #237A2E}
.gauge.blue .fill{background:#4FC3E8;box-shadow:inset 0 4px 0 #B3F1FF,inset 0 -4px 0 #1E7FA0}
.gauge .lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:800;color:#fff;z-index:1;
  text-shadow:1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000}
.members{display:grid;gap:6px}
.member{display:flex;align-items:center;gap:10px;padding:8px 10px;border:2px solid var(--edge);background:#E4E4E4;box-shadow:inset 2px 2px 0 #fff,inset -2px -2px 0 #B0B0B0}
.member.me{background:#FFF0B3;box-shadow:inset 2px 2px 0 #FFFBE0,inset -2px -2px 0 #D2B54A}
.member .ricon{width:46px;height:46px;border:2px solid var(--edge);display:flex;align-items:center;justify-content:center;flex:none;box-shadow:inset 2px 2px 0 rgba(255,255,255,.45),inset -2px -2px 0 rgba(0,0,0,.25)}
.member .who{font-weight:800;font-size:16px}
.member .what{font-size:14px;color:var(--sub);font-weight:600;line-height:1.45}
.member .chk{margin-left:auto}
.mission{padding:0;overflow:hidden}
.mhead{padding:14px 18px;color:#fff;display:flex;gap:12px;align-items:center;border-bottom:3px solid var(--edge);
  background:linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.35)),var(--tex-stone) #6B6B6B;background-size:auto,48px 48px;image-rendering:pixelated}
.mhead .kicker{font-family:var(--pixel);font-size:12px;color:#FFF07A}
.mhead .ttl{font-family:var(--pixel);font-weight:700;font-size:21px;text-shadow:2px 2px 0 #000}
.mhead img{background:rgba(255,255,255,.9);border:2px solid #000;padding:2px}
.mbody{padding:16px 18px}
.mbody .desc{font-weight:700;font-size:16.5px}
.mytask{border:3px solid var(--edge);padding:14px;background:#FFF0B3;box-shadow:inset 3px 3px 0 #FFFBE0,inset -3px -3px 0 #D2B54A;margin:12px 0}
.mytask .lab{font-size:14px;font-weight:800;color:#6B5200;display:flex;align-items:center;gap:6px}
.mytask .txt{font-size:20px;font-weight:800;margin-top:4px}
.donebtn.on{background:var(--grass)}
.goalbox{display:flex;align-items:center;gap:12px}

/* ---------- 오버레이 ---------- */
#overlay{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(12,20,40,.72);padding:16px}
#overlay.show{display:flex}
.count{font-size:150px;color:#FFF24A;text-shadow:6px 6px 0 #4A4100;-webkit-text-stroke:3px #000;animation:pop .3s steps(4) both}
.slotbox,.tslot{background:var(--panel);color:var(--text);border:3px solid var(--edge);padding:24px;text-align:center;width:100%;max-width:440px;
  box-shadow:inset 4px 4px 0 var(--panel-hi),inset -4px -4px 0 var(--panel-lo),8px 8px 0 rgba(0,0,0,.4)}
.tslot{max-width:1000px;max-height:92vh;overflow:auto;text-align:left}
.slotwin{height:150px;margin:14px 0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px}
.slotwin .st{font-family:var(--pixel);font-weight:700;font-size:20px}
.slotwin.rolling img,.slotwin.rolling .st{filter:blur(1px);opacity:.75}
.tslot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:14px}
.tslot-cell{padding:14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.tslot-cell .st{font-family:var(--pixel);font-weight:700;font-size:18px}
.tslot-cell .tn{font-weight:800;display:flex;align-items:center;gap:6px}
.tslot-cell.rolling img,.tslot-cell.rolling .st{filter:blur(1px);opacity:.7}
.tslot-cell.rolling .tn img{filter:none;opacity:1}
.tslot-cell.landed{background:#FFE58A;box-shadow:inset 3px 3px 0 #FFF6CC,inset -3px -3px 0 #C9A21E;animation:pop .3s steps(4) both}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(140px);visibility:hidden;background:#26173D;color:#fff;font-weight:700;padding:12px 18px;
  border:3px solid #000;box-shadow:inset 2px 2px 0 #4A2F78;z-index:60;transition:transform .25s steps(5),visibility .25s;max-width:calc(100% - 32px);text-align:center}
#toast.show{transform:translateX(-50%) translateY(0);visibility:visible}
.confetti{position:fixed;top:-40px;z-index:70;pointer-events:none;border:2px solid rgba(0,0,0,.45);animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}

/* ---------- 교사 ---------- */
.thead{position:sticky;top:0;z-index:20;color:#fff;padding:12px 16px 16px;border-bottom:4px solid #000;
  background:linear-gradient(rgba(0,0,0,.18),rgba(0,0,0,.38)),var(--tex-grass-side) #6B4A2F;background-size:auto,64px 64px;image-rendering:pixelated}
.thead .in{max-width:1300px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.thead .logo{font-family:var(--pixel);font-weight:700;font-size:19px;text-shadow:2px 2px 0 #000;display:flex;align-items:center;gap:8px}
.thead select{padding:7px 10px;border:3px solid #000;background:#fff;color:var(--text);font-weight:800}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:20px 0 16px}
.tab{padding:10px 16px;border:3px solid var(--edge);background:#8F8F8F;color:#fff;font-size:16px;text-shadow:2px 2px 0 rgba(0,0,0,.45);
  box-shadow:inset 3px 3px 0 rgba(255,255,255,.4),inset -3px -3px 0 rgba(0,0,0,.3)}
.tab.on{background:var(--panel);color:var(--text);text-shadow:none;transform:translateY(-3px);box-shadow:inset 3px 3px 0 #fff,inset -3px -3px 0 #A9A9A9,0 4px 0 rgba(0,0,0,.3)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{padding:14px 16px}
.stat .n{font-family:var(--pixel);font-weight:700;font-size:34px}
.stat .l{font-weight:800;color:var(--sub);font-size:14px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:6px;margin-top:12px}

const ICON_CACHE={};
function iconURL(name){
  if(ICON_CACHE[name])return ICON_CACHE[name];
  const c=document.createElement('canvas');c.width=c.height=16;const g=c.getContext('2d');
  if(name.startsWith('blk:')){const [,k,f]=name.split(':');drawBlock(k,g,f||'side')}
  else if(name.startsWith('pick:')){
    const tier={wood:['#B88B4A','#7A5A30'],stone:['#A7A7A7','#6E6E6E'],iron:['#F0F0F0','#B0B0B0'],gold:['#FCE65A','#D49A00'],diamond:['#6FF0E6','#2AA6A0']}[name.slice(5)];
    const d=PIX.pick;d.m.forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch==='.')return;g.fillStyle=ch==='h'?tier[0]:ch==='H'?tier[1]:d.p[ch];g.fillRect(x,y,1,1)}));
  }
  else if(PIX[name]){const d=PIX[name];d.m.forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch==='.')return;g.fillStyle=d.p[ch];g.fillRect(x,y,1,1)}))}
  else drawProcedural(name,g);
  return ICON_CACHE[name]=c.toDataURL();
}
const ico=(name,size=24,style='')=>`<img class="px" src="${iconURL(name)}" width="${size}" height="${size}" alt="" style="${style}">`;

function cubeHTML(kind='grass',size=96,still=false){
  const side=iconURL('blk:'+kind),top=iconURL('blk:'+kind+(kind==='grass'?':top':'')),bot=iconURL('blk:'+kind+(kind==='grass'?':bottom':''));
  const f=(c,u)=>`<i class="${c}" style="background-image:url(${u})"></i>`;

}

function getAt(o,path){if(!path)return o;for(const k of path.split('/')){if(o==null)return null;o=o[k]}return o===undefined?null:o}
function setAt(o,path,val){const ks=path.split('/');let cur=o;for(let i=0;i<ks.length-1;i++){if(typeof cur[ks[i]]!=='object'||cur[ks[i]]===null)cur[ks[i]]={};cur=cur[ks[i]]}
  const last=ks[ks.length-1];if(val===null||val===undefined)delete cur[last];else cur[last]=clone(val)}
const roleTag = r=>{const R=ROLES[r];return R?`<span class="rtag" style="background:${R.color}">${ico(R.i,20)}${R.name}</span>`:''};
const levelOf = stars=>{let L=LEVELS[0];LEVELS.forEach(l=>{if(stars>=l.min)L=l});const i=LEVELS.indexOf(L);const next=LEVELS[i+1];return {...L,next,idx:i}};

   🔌 DB 계층 — Firebase Realtime Database 또는 데모(localStorage)
   ===================================================================== */
const LS_DB='tm_demo_db_v1';
const DB = {
  demo:true, fb:null, L:[],
  async init(){
    if(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.databaseURL){
      try{
        await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
        await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js');
        firebase.initializeApp(FIREBASE_CONFIG); this.fb=firebase.database(); this.demo=false;
      }catch(e){console.error(e);toast('Firebase 연결 실패 → 데모 모드로 실행해요',3500)}
    }
    if(this.demo){
      window.addEventListener('storage',e=>{if(e.key===LS_DB)this._emit()});
      try{this.bc=new BroadcastChannel('tm_demo');this.bc.onmessage=()=>this._emit()}catch{}
    }
  },
  _read(){try{return JSON.parse(localStorage.getItem(LS_DB))||{}}catch{return {}}},
  _write(d){localStorage.setItem(LS_DB,JSON.stringify(d));this._emit();try{this.bc&&this.bc.postMessage(1)}catch{}},
  _emit(){const d=this._read();this.L.forEach(l=>{const v=JSON.stringify(getAt(d,l.path));if(v!==l.last){l.last=v;l.cb(JSON.parse(v))}})},
  ref(p){return this.fb.ref(p?ROOT+'/'+p:ROOT)},
  on(path,cb){
    if(!this.demo){const r=this.ref(path);const h=s=>cb(s.val());r.on('value',h);return ()=>r.off('value',h)}
    const l={path,cb,last:undefined};this.L.push(l);const v=JSON.stringify(getAt(this._read(),path));l.last=v;cb(JSON.parse(v));
    return ()=>{this.L=this.L.filter(x=>x!==l)};
  },
  async get(path){if(!this.demo)return (await this.ref(path).get()).val();return clone(getAt(this._read(),path))},
  set(path,val){if(!this.demo)return this.ref(path).set(val);const d=this._read();setAt(d,path,val);this._write(d);return Promise.resolve()},
  update(path,obj){if(!this.demo)return this.ref(path).update(obj);const d=this._read();for(const [k,v] of Object.entries(obj))setAt(d,path?path+'/'+k:k,v);this._write(d);return Promise.resolve()}
};
function demoBar(){return DB.demo?`<div class="demo-bar"><b>데모 모드</b> · 같은 브라우저의 탭끼리만 연결돼요. 실제 수업은 Firebase 설정이 필요해요 (README 참고)</div>`:''}

   🧮 점수 · 팀 편성 알고리즘
   ===================================================================== */
function scoreAnswers(ans){ // ans: 'YNYN...'
  const raw={};ROLE_IDS.forEach(r=>raw[r]=0);
  [...ans].forEach((a,i)=>{const pick=a==='Y'?QUESTIONS[i].y:QUESTIONS[i].n;for(const r in pick)raw[r]+=pick[r]});
  const norm={};ROLE_IDS.forEach(r=>norm[r]=raw[r]/MAXS[r]);
  const top=Math.max(...ROLE_IDS.map(r=>norm[r]));
  const role=shuffle(ROLE_IDS.filter(r=>Math.abs(norm[r]-top)<1e-9))[0]; // 동점이면 랜덤
  return {raw,norm,role};
}
// 팀 안에서 역할이 겹치지 않도록 '성향 점수 합'이 최대가 되는 배치를 찾음
function assignRoles(members){ // [{sid,norm,role}]
  const out={};if(!members.length)return out;
  const noise={};members.forEach(m=>ROLE_IDS.forEach(r=>noise[m.sid+r]=Math.random()*0.01));
  const sc=(m,r)=>((m.norm&&m.norm[r])||0)+(m.role===r?0.35:0)+noise[m.sid+r];
  const head=shuffle(members).slice(0,6);
  let best=-1,bestAsg=null;
  const rec=(i,used,sum,asg)=>{
    if(i===head.length){if(sum>best){best=sum;bestAsg=[...asg]}return}
    for(const r of ROLE_IDS){if(used.has(r))continue;used.add(r);asg.push(r);rec(i+1,used,sum+sc(head[i],r),asg);asg.pop();used.delete(r)}
  };
  rec(0,new Set(),0,[]);
  head.forEach((m,i)=>out[m.sid]=bestAsg[i]);
  members.forEach(m=>{if(!out[m.sid])out[m.sid]=m.role||'cheer'}); // 7명 이상인 팀의 추가 인원
  return out;
}
function buildTeams(students,count){
  const done=students.filter(s=>s.status==='done'&&s.role);
  const teams=Array.from({length:count},()=>({list:[],rc:{}}));
  const byRole={};ROLE_IDS.forEach(r=>byRole[r]=shuffle(done.filter(s=>s.role===r)));
  // 인원이 많은 성향부터 → 가장 인원이 적고, 같은 성향이 적은 팀으로 배치
  const order=ROLE_IDS.slice().sort((a,b)=>byRole[b].length-byRole[a].length);
  for(const r of order)for(const s of byRole[r]){
    let best=null,bk=null;
    shuffle(teams).forEach(t=>{const k=[t.list.length,t.rc[r]||0];if(!best||k[0]<bk[0]||(k[0]===bk[0]&&k[1]<bk[1])){best=t;bk=k}});
    best.list.push(s);best.rc[r]=(best.rc[r]||0)+1;
  }
  const kinds=shuffle(BLOCK_IDS);
  const out={};
  teams.forEach((t,i)=>{const blk=kinds[i%kinds.length];out['t'+(i+1)]={no:i+1,blk,name:`${BLOCKS[blk].n} 원정대`,members:assignRoles(t.list)}});
  return out;
}

function subscribeStudent(){
  S.view=S.sig=null;

}
function renderStudent(){
  if(S.busy)return;
  const d=S.data;
  if(!d||!d.meta)return studentLogout('반 정보가 사라졌어요. 다시 입장해 주세요.');
  const st=(d.students||{})[S.sid];
  if(!st)return studentLogout('선생님이 입장 기록을 지웠어요. 다시 입장해 주세요.');
  if(st.status!=='done'){if(S.view!=='quiz'){S.view='quiz';S.sig=null;startQuiz(st)}return}
  if(!d.revealed){
    const sig='result|'+st.role;
    if(S.sig!==sig){S.view='result';S.sig=sig;renderResult(st)}
    return;
  }
  const seenKey=`tm_seenReveal_${S.room}`;
  if(S.view!=='team'&&LS.get(seenKey)!==d.revealAt){
    S.view='team';S.busy=true;LS.set(seenKey,d.revealAt);
    return countdown(()=>{S.busy=false;S.sig=null;renderTeam(true)});
  }
  S.view='team';S.sig=null;renderTeam(false);
}

function myTeam(d){const teams=d.teams||{};for(const tid in teams){if(teams[tid].members&&teams[tid].members[S.sid])return [tid,teams[tid]]}return [null,null]}
function teamProgress(d,tid,team){
  const mem=Object.keys((team&&team.members)||{});
  const ms=((d.missions||{})[tid])||{};const rounds=ms.rounds||{};
  const list=Object.entries(rounds).map(([rid,r])=>({rid,...r})).sort((a,b)=>((a.at||0)-(b.at||0))||(a.rid<b.rid?-1:1));
  const cleared=list.filter(r=>r.status==='approved').length;
  const bonus=((d.bonus||{})[tid])||0;
  const cur=ms.cur&&rounds[ms.cur]?{rid:ms.cur,...rounds[ms.cur]}:null;
  const curNo=cur?list.findIndex(r=>r.rid===cur.rid)+1:0;
  const curDone=cur?mem.filter(s=>(cur.checks||{})[s]).length:0;
  return {stars:cleared+bonus,cleared,bonus,cur,curNo,curDone,total:mem.length,mem,list};
}
function classStars(d){let t=0;for(const tid in (d.teams||{}))t+=teamProgress(d,tid,d.teams[tid]).stars;return t}

  const goal=d.goal||10,have=classStars(d),p=Math.min(100,Math.round(have/goal*100));

    <h3>우리 반 공동 목표 ${have>=goal?'— 달성!':''}</h3>

    <div class="gauge blue"><div class="fill" style="width:${p}%"></div><div class="lbl">${STAR(14)} ${have} / ${goal}</div></div></div></div>`;
}

async function addBots(d){

function bestFreeRole(stu,mem){
  const used=new Set(Object.values(mem||{}));
  const order=ROLE_IDS.slice().sort((a,b)=>((stu.norm||{})[b]||0)+(stu.role===b?1:0)-((stu.norm||{})[a]||0)-(stu.role===a?1:0));
  return order.find(r=>!used.has(r))||stu.role||'cheer';
}
function moveStudent(sid,from,to){
  const d=TS.data;const teams=d.teams||{};const stu=(d.students||{})[sid]||{};
  const up={};
  if(from!=='pool')up[`teams/${from}/members/${sid}`]=null;
  if(to!=='pool'){
    const cur=from!=='pool'?teams[from].members[sid]:null;
    const tm={...(teams[to].members||{})};
    up[`teams/${to}/members/${sid}`]=(cur&&!Object.values(tm).includes(cur))?cur:bestFreeRole(stu,tm);
  }
  DB.update(`rooms/${TS.room}`,up);
}
function startDrag(chip,e){
  if(e.button!==undefined&&e.button!==0)return;
  const sid=chip.dataset.sid;const from=chip.closest('[data-drop]').dataset.drop;
  const sx=e.clientX,sy=e.clientY;let ghost=null,over=null;
  const rect=chip.getBoundingClientRect();const ox=sx-rect.left,oy=sy-rect.top;
  const move=ev=>{
    if(!ghost){if(Math.hypot(ev.clientX-sx,ev.clientY-sy)<6)return;
      TS.dragging=true;ghost=chip.cloneNode(true);ghost.classList.add('ghost');ghost.style.width=rect.width+'px';document.body.appendChild(ghost);chip.classList.add('src')}
    ev.preventDefault();
    ghost.style.left=(ev.clientX-ox)+'px';ghost.style.top=(ev.clientY-oy)+'px';
    const el=document.elementFromPoint(ev.clientX,ev.clientY);const z=el&&el.closest('[data-drop]');
    if(z!==over){over&&over.classList.remove('over');over=z;over&&over.classList.add('over')}
    if(ev.clientY<60)window.scrollBy(0,-14);else if(ev.clientY>innerHeight-60)window.scrollBy(0,14);
  };
  const end=()=>{
    window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',end);window.removeEventListener('pointercancel',end);
    if(ghost){ghost.remove();chip.classList.remove('src');over&&over.classList.remove('over');
      const to=over&&over.dataset.drop;
      TS.dragging=false;
      if(to&&to!==from)moveStudent(sid,from,to);
      if(TS.pending){TS.pending=false;renderTeacher()}
    }
  };
  window.addEventListener('pointermove',move,{passive:false});window.addEventListener('pointerup',end);window.addEventListener('pointercancel',end);
}

        ${M?`<div class="cur"><div class="row between"><div class="ico-h" style="font-weight:800">${ico(M.i,22)}#${P.curNo} ${M.t}</div>${badge}</div>
          <div class="note" style="margin-top:2px">${M.d}</div>
          <div class="note" style="margin-top:4px;color:#1E4E9A">확인할 것: ${M.proof}</div>
          <div class="gauge green" style="margin-top:8px"><div class="fill" style="width:${pct}%"></div><div class="lbl">${P.curDone}/${P.total}명 내 몫 완료</div></div>
          <div class="mchips">${mates.map(m=>`<button class="mchip ${ch[m.sid]?'ok':''}" data-chk="${tid}|${P.cur.rid}|${m.sid}" title="${esc((M.tasks[m.r]||''))}">${rIco(m.r,18)}${esc(m.name)}</button>`).join('')}</div>
          ${P.cur.proof?`<div class="proofbox" style="margin-top:8px;padding:8px 10px"><div class="note">팀 인증 · ${esc((studs[P.cur.proofBy]||{}).name||'')}</div><div style="font-weight:700;white-space:pre-line">${esc(P.cur.proof)}</div></div>`:''}
          ${stt==='review'?`<div class="row" style="margin-top:8px"><button class="btn sm green" data-appr="${tid}|${P.cur.rid}">${STAR(14)} 승인 (별 +1)</button><button class="btn sm light" data-retry="${tid}|${P.cur.rid}">다시 하기</button></div>`:''}
          ${stt==='approved'?`<div class="row" style="margin-top:8px"><button class="btn sm light" data-unappr="${tid}|${P.cur.rid}">승인 취소</button></div>`:''}
        </div>`:`<div class="cur note">아직 미션이 없어요</div>`}
        ${P.list.length?`<div class="hist" style="margin-bottom:8px">${P.list.map((r,i)=>{const m=MISSION_BY_ID[r.mid]||{};return `<span class="${r.status==='approved'?'ok':''}" title="${esc(m.t||'')}">${ico(m.i||'paper',16)}#${i+1}${r.status==='approved'?' 성공':''}</span>`}).join('')}</div>`:''}
        <div class="row"><button class="btn sm light" data-draw="${tid}">${ico('die',16)} 이 팀만 ${M?'새 미션':'뽑기'}</button>
          <span class="grow"></span><button class="btn sm yellow" data-bonus="${tid}|1" title="보너스 별">${STAR(14)}+1</button><button class="btn sm light" data-bonus="${tid}|-1" title="보너스 별 빼기">−1</button></div>
      </div>`}).join('')}</div>
    <div class="row" style="justify-content:flex-end"><button class="btn sm red" id="resetMissions">미션·별 기록 초기화</button></div>
  </div>`;
  const rpath=v=>{const [tid,rid]=v.split('|');return `rooms/${TS.room}/missions/${tid}/rounds/${rid}`};
  $('#drawAll').onclick=()=>drawMissions(tids,true);
  $$('[data-draw]').forEach(b=>b.onclick=()=>drawMissions([b.dataset.draw],false));
  $$('[data-chk]').forEach(b=>b.onclick=()=>{const [tid,rid,sid]=b.dataset.chk.split('|');const v=(((d.missions[tid]||{}).rounds||{})[rid]||{}).checks||{};
    DB.set(`rooms/${TS.room}/missions/${tid}/rounds/${rid}/checks/${sid}`,v[sid]?null:true)});
  $$('[data-appr]').forEach(b=>b.onclick=()=>{DB.update(rpath(b.dataset.appr),{status:'approved',apprAt:Date.now()});confetti(40);toast('승인! 팀 별 +1')});
  $$('[data-unappr]').forEach(b=>b.onclick=()=>DB.update(rpath(b.dataset.unappr),{status:'review'}));
  $$('[data-retry]').forEach(b=>b.onclick=async()=>{
    const note=await ask({title:'다시 하기 요청',msg:'팀에게 보낼 한마디 (무엇을 보완하면 될까요?)',input:{placeholder:'예) 모든 팀원의 의견이 들어가게 해 주세요'},ok:'보내기'});
    if(note===null)return;DB.update(rpath(b.dataset.retry),{status:'retry',note:note.trim()||'조금 더 보완해 주세요'});toast('팀에게 다시 하기를 요청했어요')});
  $$('[data-bonus]').forEach(b=>b.onclick=()=>{const [tid,v]=b.dataset.bonus.split('|');const cur=((d.bonus||{})[tid])||0;DB.set(`rooms/${TS.room}/bonus/${tid}`,Math.max(0,cur+(+v)))});
  $('#gMinus').onclick=()=>DB.set(`rooms/${TS.room}/goal`,Math.max(1,goal-1));
  $('#gPlus').onclick=()=>DB.set(`rooms/${TS.room}/goal`,goal+1);
  $('#resetMissions').onclick=async()=>{if(await ask({title:'미션·별 기록을 초기화할까요?',msg:'모든 팀의 미션과 별이 지워져요.',ok:'초기화',danger:true}))DB.update(`rooms/${TS.room}`,{missions:null,bonus:null})};
}
function pickMissions(d,tids){
  const res={};const takenNow=new Set();
  tids.forEach(tid=>{
    const rounds=(((d.missions||{})[tid]||{}).rounds)||{};
    const usedByTeam=new Set(Object.values(rounds).map(r=>r.mid));
    let cand=MISSIONS.filter(m=>!usedByTeam.has(m.id)&&!takenNow.has(m.id));
    if(!cand.length)cand=MISSIONS.filter(m=>!usedByTeam.has(m.id));
    if(!cand.length)cand=MISSIONS.filter(m=>m.id!==(rounds[((d.missions||{})[tid]||{}).cur]||{}).mid);
    const m=shuffle(cand)[0];takenNow.add(m.id);res[tid]=m;
  });
  return res;
}
async function drawMissions(tids,all){
  const d=TS.data;const teams=d.teams;
  const pending=tids.filter(tid=>{const P=teamProgress(d,tid,teams[tid]);return P.cur&&P.cur.status!=='approved'});
  if(pending.length&&!(await ask({title:'아직 승인 안 된 미션이 있어요',msg:`${pending.length}팀이 지금 미션을 진행 중이에요. 새 미션을 뽑을까요?\n(승인 안 된 미션은 별 없이 넘어가요)`,ok:'새로 뽑기'})))return;
  const picks=pickMissions(d,tids);
  const tn=tid=>`<div class="tn">${blockIco(teamBlock(teams[tid]),20)}${teams[tid].no}모둠</div>`;
  overlay(`<div class="tslot pop"><div class="row between"><h2 class="ico-h">${ico('die',30)}협력 미션 뽑기!</h2><button class="btn sm light" id="tsClose" style="visibility:hidden">닫기 ✕</button></div>
    <div class="tslot-grid">${tids.map(tid=>`<div class="tslot-cell slotbg rolling" id="ts_${tid}">${tn(tid)}<span class="ic">${ico('die',56)}</span><div class="st">…</div></div>`).join('')}</div></div>`);
  let stopped=0;const t0=Date.now();
  await new Promise(res=>{
    const tick=()=>{
      tids.forEach((tid,i)=>{const cell=$('#ts_'+tid);if(!cell||cell.classList.contains('landed'))return;
        if(Date.now()-t0>1200+i*450){const m=picks[tid];cell.classList.remove('rolling');cell.classList.add('landed');cell.innerHTML=`${tn(tid)}${ico(m.i,56)}<div class="st">${m.t}</div><div class="note" style="color:var(--text)">${m.d}</div>`;stopped++}
        else{const m=MISSIONS[Math.floor(Math.random()*MISSIONS.length)];cell.querySelector('.ic').innerHTML=ico(m.i,56);cell.querySelector('.st').textContent=m.t}});
      if(stopped<tids.length)setTimeout(tick,80);else res();
    };tick();
  });
  confetti(70);
  const btn=$('#tsClose');if(btn){btn.style.visibility='visible';btn.onclick=closeOverlay}
  const up={};const now=Date.now();
  tids.forEach((tid,i)=>{const rid='r'+(now+i).toString(36);up[`missions/${tid}/rounds/${rid}`]={mid:picks[tid].id,at:now};up[`missions/${tid}/cur`]=rid});
  await DB.update(`rooms/${TS.room}`,up);
}

boot();
</script>
